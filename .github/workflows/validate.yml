name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Hosted arm64 capacity can leave macos-latest jobs unacquired.
          - macos-26-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build distributive
        run: npm run build
      - name: Run typecheck
        run: npm run typecheck
      - name: Run Windows bus lifecycle probes
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="active profile endpoint|replacement endpoint generation"
          tests/bus.test.ts
      - name: Run Windows outbound voice executable probe
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="Windows cmd|multipart voice calls|scoped follower API calls"
          tests/command-templates.test.ts tests/outbound-voice.test.ts
          tests/bus-follower.test.ts tests/bus-leader.test.ts
      - name: Run tests
        if: matrix.os != 'macos-26-intel'
        run: npm test
      # Wall-clock latency tests share a small Intel runner; fewer parallel test files keep every assertion and deadline unchanged.
      - name: Run tests with reduced concurrency
        if: matrix.os == 'macos-26-intel'
        run: npm run test:low-concurrency
      - name: Check package contents
        run: npm run pack:check
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit
